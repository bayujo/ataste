<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF3EA">
<title>Ataste invite</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=roundo@1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap">
<style>
  /* Design 2-7 "Web fallback" (Claude Design, Ataste Screens 2). Sizes are the design's px. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #FBF3EA; color: #2B1A12; font-family: Manrope, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 402px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; }
  .logo { align-self: center; margin-top: 16px; background: #9D5C1D; border: 3px solid #9D5C1D; border-radius: 999px; padding: 3px 14px 6px; box-shadow: 0 3px 0 #2B1A12; font: 700 24px/1 Roundo, sans-serif; color: #FBF3EA; }
  .card { margin-top: 24px; background: #fff; border-radius: 32px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { font: 600 12px/1 Manrope; letter-spacing: .03em; text-transform: uppercase; color: #9D5C1D; }
  h1 { margin: 0; font: 700 26px/1.1 Roundo, sans-serif; }
  .facts { display: flex; flex-direction: column; gap: 8px; font: 500 14px Manrope; color: #5A4237; }
  .facts span { display: flex; gap: 8px; align-items: center; }
  svg { flex: none; }
  .steps { margin-top: 60px; display: flex; flex-direction: column; gap: 12px; }
  .step { display: flex; gap: 12px; align-items: center; padding: 0 6px; font: 600 15px Manrope; }
  .step + a + .step { padding-top: 12px; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: #2B1A12; color: #FBF3EA; display: flex; align-items: center; justify-content: center; font: 700 13px Roundo, sans-serif; }
  .btn { display: flex; align-items: center; justify-content: center; padding: 14px 24px; border-radius: 999px; font: 600 17px/1.25 Manrope; text-decoration: none; }
  .primary { background: #9D5C1D; border: 4px solid #9D5C1D; color: #FBF3EA; }
  .secondary { background: #FBF3EA; border: 4px solid #F9CFAF; color: #2B1A12; }
  .note { text-align: center; font: 500 12px/1.45 Manrope; color: #7A6257; padding: 4px 20px; margin: 0; }
  .closed { color: #E40014; }
</style>
</head>
<body>
<main>
  <span class="logo">ataste</span>
  <section class="card" id="card">
    <span class="eyebrow" id="eyebrow">You're invited to a group order</span>
    <h1 id="name">Ataste group order</h1>
    <div class="facts" id="facts"></div>
  </section>
  <div class="steps">
    <div class="step"><span class="num">1</span>Install Ataste from TestFlight</div>
    <a class="btn primary" id="get" href="https://testflight.apple.com/join/U65TErQM">Get Ataste on TestFlight</a>
    <div class="step"><span class="num">2</span>Come back and open the invite</div>
    <a class="btn secondary" id="open" href="#">Open in Ataste</a>
    <p class="note">If the app opens on Home, tap “Paste a join link”. The link is already copied.</p>
  </div>
</main>
<script>
  // Icons from the design's ataste-art.js (truck, clock, users), 16px, 2px cocoa-brown stroke.
  const I = {
    truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.6a1 1 0 0 0-.2-.6l-3.5-4.4a1 1 0 0 0-.8-.4H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
    clock: '<circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/>',
    users: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>'
  };
  const icon = n => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const when = iso => {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Makassar', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(iso)).map(x => [x.type, x.value]));
    return `${p.weekday} ${p.day} ${p.month}, ${p.hour}:${p.minute} WITA`;
  };

  const code = (location.pathname.split('/').filter(Boolean).pop() || '').toUpperCase();
  const link = location.origin + location.pathname.replace(/[^/]+\/?$/, '') + code;  // /j/CODE (VPS) or /ataste/j/CODE (GitHub Pages)
  const copyLink = () => { try { navigator.clipboard.writeText(link); } catch (e) {} };
  document.getElementById('open').href = `ataste://join/${code}`;
  for (const id of ['get', 'open']) document.getElementById(id).addEventListener('click', copyLink);

  fetch('https://scgyssmzfurqjkgfomtq.supabase.co/rest/v1/rpc/web_invite', {
    method: 'POST',
    headers: { apikey: 'sb_publishable_ihHWwF0eSLK1SSkR85lS_A_25gle_43', 'Content-Type': 'application/json' },
    body: JSON.stringify({ code })
  }).then(r => r.json()).then(rows => {
    const g = Array.isArray(rows) && rows[0];
    if (!g) {
      document.getElementById('eyebrow').textContent = 'Invite not found';
      document.getElementById('name').textContent = 'This link isn’t valid';
      document.getElementById('facts').innerHTML = '<span>Ask your host to share the link again.</span>';
      return;
    }
    document.title = `${g.name} · Ataste`;
    document.getElementById('eyebrow').textContent = `${g.host_name} invited you to a group order`;
    document.getElementById('name').textContent = g.name;
    const more = g.member_count - g.members.length;
    const facts = [
      `<span>${icon('truck')}${esc(when(g.delivery_at))} · ${esc(g.place)}</span>`,
      g.cutoff_at ? `<span>${icon('clock')}Locks ${esc(when(g.cutoff_at))}</span>` : '',
      `<span>${icon('users')}${esc(g.members.join(', '))}${more > 0 ? ` +${more}` : ''}</span>`,
      g.state !== 'open' ? '<span class="closed">This group is no longer taking orders.</span>' : ''
    ];
    document.getElementById('facts').innerHTML = facts.join('');
  }).catch(() => {});
</script>
</body>
</html>
